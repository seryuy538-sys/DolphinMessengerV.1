name: Build Flet App
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build APK
        run: |
          pip install flet
          flet build apk --name "Dolphin" --icon icon.png
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dolphin-APK
          path: build/apk/bundle/app-release.apk
